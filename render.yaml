services:
  - type: web
    name: tradesim
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: APP_PASSWORD
        sync: false
    disk:
      name: tradesim-data
      mountPath: /var/data
      sizeGB: 1
